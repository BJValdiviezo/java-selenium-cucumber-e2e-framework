name: Java Selenium E2E Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio desde la rama main
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar JDK 17
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Ejecutar las pruebas automatizadas en modo Headless
    - name: Ejecutar Pruebas Automatizadas con Maven
      run: mvn test -Dbrowser=chrome -Dheadless=true

    # 4. Guardar los reportes de Cucumber como artefactos descargables
    - name: Guardar Reportes de Cucumber
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-test-reports
        path: target/cucumber-reports/
name: Java Selenium E2E Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Java 17
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Crear carpetas de reportes por defecto (evita el aviso de No files found)
    - name: Preparar directorios de reportes
      run: |
        mkdir -p target/cucumber-reports
        mkdir -p allure-results

    # 4. Ejecutar las pruebas automatizadas
    - name: Ejecutar Pruebas Automatizadas con Maven
      run: mvn test -Dbrowser=chrome -Dheadless=true
      continue-on-error: true

    # 5. Guardar Reportes de Cucumber en Artifacts
    - name: Guardar Reportes de Cucumber
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-test-reports
        path: target/cucumber-reports/

    # 6. Instalar Allure CLI directamente en la VM (sin Docker)
    - name: Instalar Allure CLI
      if: always()
      run: |
        wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -zxvf allure-2.27.0.tgz
        sudo mv allure-2.27.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    - name: Generar Reporte de Allure
      if: always()
      run: allure generate allure-results --clean -o allure-report

    # 7. Publicar en GitHub Pages
    - name: Publicar Reporte en GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report